[tool.poetry]
name = "crawler"
version = "0.1.0"
description = "Taiwan rental house database"
authors = ["ddio <ddio@ddio.io>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
# cffi = "==1.13.2"
scrapy-tw-rental-house = "^2.5.0"
sentry-sdk = "^1.39.1"
scrapy-rotating-proxies = "^0.6.2"
requests = "^2.31.0"
python-dotenv = "^1.0"
boto3 = "^1.43.82"
pyyaml = "^6.0.3"
pyarrow = ">=21"


[tool.poetry.group.dev.dependencies]
pylint = "*"
pylint-plugin-utils = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
