[tool.poetry]
name = "crawler"
version = "0.1.0"
description = "Taiwan rental house database"
authors = ["ddio <ddio@ddio.io>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
# cffi = "==1.13.2"
django = "^5"
# Pin these to the same 4.x line as scrapy-tw-rental-house's opencv-python: paddleocr
# and albumentations pull them in transitively with no upper bound, and letting them
# drift to the OpenCV 5.x line while opencv-python stays on 4.x installs mismatched
# native builds into the same `cv2` package, which segfaults on import.
opencv-contrib-python = "^4.11.0.86"
opencv-python-headless = "^4.11.0.86"
scrapy-tw-rental-house = "^2.1.8"
psycopg2-binary = "^2.9.9"
pylint-django = "^2.5.5"
sentry-sdk = "^1.39.1"
scrapy-rotating-proxies = "^0.6.2"
requests = "^2.31.0"
python-dotenv = "^1.0"


[tool.poetry.group.dev.dependencies]
pylint-django = "*"
pylint = "*"
pylint-plugin-utils = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
