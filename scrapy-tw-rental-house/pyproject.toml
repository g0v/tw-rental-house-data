[tool.poetry]
name = "scrapy-tw-rental-house"
version = "2.1.8"
description = "Scrapy spider for TW Rental House"
readme = "README.md"
authors = ["ddio <ddio@ddio.io>"]
license = "MIT"
repository = "https://github.com/g0v/tw-rental-house-data/tree/master/scrapy-tw-rental-house"

[[tool.poetry.source]]
name = "paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.10"
Scrapy = "^2.11.0"
scrapy-playwright = "^0.0.42"
playwright = "^1.50.0"
opencv-python = "^4.11.0.86"
# Pinned to the same 4.x line as opencv-python: paddleocr/albumentations pull these in
# transitively with no upper bound, and letting them drift to the OpenCV 5.x line while
# opencv-python stays on 4.x installs mismatched native builds into the same `cv2`
# package, which segfaults on import.
opencv-contrib-python = "^4.11.0.86"
opencv-python-headless = "^4.11.0.86"
numpy = "^2.2.3"
paddlepaddle = {version = "3.0.0rc1", source = "paddle"}
paddleocr = "^2.10.0"
# paddle imports this at runtime (paddle/utils/cpp_extension/cpp_extension.py) but
# doesn't declare it as a dependency; recent Python venvs no longer bundle it by
# default, so without this pin `import paddleocr` fails with ModuleNotFoundError.
setuptools = "*"

[tool.poetry.scripts]
twrh = "scrapy_twrh.cli.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
