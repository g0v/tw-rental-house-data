# twrh-dataset 測試（S6 起不需要 DB）：
#   tests/          檔案 queue 語意矩陣（architecture-roadmap 2-3 起的 B 層，2026-10 由 Django
#                   TestCase＋PostGIS 搬成 unittest）、fold／總表／seeding／manifest／斷言引擎等
#   twrhctl/tests/  指令入口行程內不得載入 django
# 爬蟲類 live probe 依既定原則不進公開 CI。
name: dataset tests

on:
  push:
    paths:
      - 'twrh-dataset/**'
      - '.github/workflows/dataset-tests.yml'
  pull_request:
    paths:
      - 'twrh-dataset/**'
      - '.github/workflows/dataset-tests.yml'

jobs:
  dataset-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twrh-dataset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # zstd：raw 日包／list stub 分區的壓縮
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
      - run: pipx install poetry
      - run: poetry install
      - name: Run dataset tests
        run: poetry run python -m unittest discover -s tests -t . -v
      - name: Run twrhctl (no-Django) tests
        run: poetry run python -m unittest discover -s twrhctl/tests -t . -v
